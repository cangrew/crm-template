name: Deploy migrations

# Applies pending Supabase migrations to the cloud database so the schema keeps
# pace with merged code. Runs when migrations change on main, and can be run
# manually from the Actions tab (e.g. to apply a backlog after adding secrets).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   – the project's database password
#   SUPABASE_PROJECT_REF   – the 20-char project ref from the dashboard URL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push-migrations:
    name: Apply migrations to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      # Stay green before the secrets exist: warn and skip the push rather than
      # failing every merge to main.
      - name: Check required secrets
        id: guard
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase deploy secrets not configured; skipping migration push. Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF under Settings → Secrets and variables → Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.guard.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        if: steps.guard.outputs.ready == 'true'
        run: supabase migration list

      - name: Push migrations
        if: steps.guard.outputs.ready == 'true'
        run: supabase db push
